name: Update NTSB Accident Dashboard

on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-ntsb-accident-stats.py'
      - '.github/workflows/update-accident-data.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MDB tools
        run: sudo apt-get update && sudo apt-get install -y mdbtools unzip

      - name: Download official NTSB bulk dataset
        run: |
          mkdir -p .ntsb
          curl --fail --location --retry 3 --retry-delay 5 \
            'https://data.ntsb.gov/avdata/FileDirectory/DownloadFile?fileID=C%3A%5Cavdata%5Cavall.zip' \
            -o .ntsb/avall.zip
          unzip -o .ntsb/avall.zip -d .ntsb/data

      - name: Inspect NTSB database schema
        run: |
          MDB_FILE="$(find .ntsb/data -type f \( -iname '*.mdb' -o -iname '*.accdb' \) | head -n 1)"
          echo '--- TABLES ---'
          mdb-tables -1 "$MDB_FILE"
          echo '--- EVENTS SAMPLE ---'
          mdb-export "$MDB_FILE" events | sed -n '1,3p'
          echo '--- AIRCRAFT SAMPLE ---'
          mdb-export "$MDB_FILE" aircraft | sed -n '1,3p'

      - name: Build transport-aircraft dashboard statistics
        run: |
          MDB_FILE="$(find .ntsb/data -type f \( -iname '*.mdb' -o -iname '*.accdb' \) | head -n 1)"
          test -n "$MDB_FILE"
          echo "Using database: $MDB_FILE"
          python3 scripts/build-ntsb-accident-stats.py "$MDB_FILE" public/ntsb-accident-stats.json

      - name: Commit refreshed statistics
        run: |
          if git diff --quiet -- public/ntsb-accident-stats.json; then
            echo 'No accident-stat changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ntsb-accident-stats.json
          git commit -m 'Refresh NTSB accident dashboard data'
          git push
